{{ define "main" }}
{{ partial "components/page-header.html" . }}
{{ $overviewKey := cond (eq .Data.Plural "categories") "categories_overview" "terms_overview" }}
<section class="section border-top bg-white">
  <div class="container taxonomy-terms-page">
    <div class="row justify-content-center">
      <div class="col-12">
        <p class="taxonomy-overview mb-4">{{ i18n $overviewKey }}</p>
        <div class="row row-cols-1 row-cols-md-2 g-4 taxonomy-terms-grid">
          {{ range .Data.Terms.Alphabetical }}
          <div class="col">
            <a class="taxonomy-term-link d-flex justify-content-between align-items-center rounded px-4 py-3 h-100" href="{{ .Page.RelPermalink }}">
              <span class="h5 mb-0">{{ .Page.Title | humanize }}</span>
              <span class="taxonomy-term-count">{{ .Count }}</span>
            </a>
          </div>
          {{ end }}
        </div>
      </div>
    </div>
  </div>
</section>
{{ end }}
