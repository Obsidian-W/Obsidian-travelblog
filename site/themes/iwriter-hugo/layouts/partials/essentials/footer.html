  <div class="container">
    <div class="row section">
      <div class="col-12">
        <h4 class="fw-semibold">{{ i18n `follow_me` }}</h4>
        {{with site.Params.social}}

          {{range .}}
          <li class="list-inline-item"><a href="{{.link | safeURL}}" title="{{.title | humanize}}" aria-label="{{.title | humanize}}">
              {{if eq .title "instagram"}}
              <svg aria-hidden="true" viewBox="0 0 448 512" width="18" height="18" fill="currentColor">
                <path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1S3.3 127.5 1.5 163.4c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/>
              </svg>
              {{else if eq .title "linkedin"}}
              <svg aria-hidden="true" viewBox="0 0 448 512" width="18" height="18" fill="currentColor">
                <path d="M100.3 448H7.4V148.9h92.9zM53.8 108.1C24.1 108.1 0 83.5 0 53.8A53.8 53.8 0 0 1 107.6 53.8c0 29.7-24.1 54.3-53.8 54.3zM447.9 448h-92.7V302.4c0-34.7-.7-79.2-48.3-79.2-48.3 0-55.7 37.7-55.7 76.7V448h-92.8V148.9h89.1v40.8h1.3c12.4-23.5 42.7-48.3 87.9-48.3 94 0 111.3 61.9 111.3 142.3V448z"/>
              </svg>
              {{else}}
              <i class="{{.icon}}" aria-hidden="true"></i>
              {{end}}
            </a>
          </li>
          {{end}}
        </ul>
        {{end}}
      </div>
    </div>

    <div class="row">
      <div class="col-12 border-top py-4">
        <p>Copyright - Timothé Paris, with a theme by <a target="_blank" rel="noopener noreferrer"
            href="https://statichunt.com/">statichunt</a></p>
      </div>
    </div>
  </div>
</footer>
