<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Armenia route map</title><desc id="desc">Armenia itinerary through Alaverdi, Yerevan, Etchmiadzin, Garni and Khor Virap.</desc>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".16"/></filter></defs><style>.bg{fill:#f5f1e9}.sea{fill:#dce8ea}.land{fill:#ded8ca;stroke:#8b8a82;stroke-width:2}.route-halo{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:#d45545;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.stop circle{fill:#d45545;stroke:#fff;stroke-width:3;filter:url(#shadow)}.stop.start circle{fill:#24735c}.stop.end circle{stroke:#71312d}.stop text{font:700 10px Arial;fill:#fff;text-anchor:middle}.label,.summary{font:600 14px Arial;fill:#292824}.label{paint-order:stroke;stroke:#f5f1e9;stroke-width:4}.title{font:700 34px Georgia;fill:#292824}.small{font:700 13px Arial;fill:#77736b;letter-spacing:2px}.note{font:11px Arial;fill:#77736b}.divider{stroke:#cbc5b9}.stop-link{cursor:pointer}.stop-link:hover{opacity:.72}</style>
  <rect class="bg" width="1200" height="760" rx="24"/><text class="title" x="42" y="52">Armenia</text><rect class="sea" x="42" y="82" width="810" height="620" rx="18"/><path class="land" d="M375 105 L540 125 L630 210 L610 315 L705 400 L650 535 L535 660 L410 610 L355 500 L285 420 L335 310 L300 205 Z"/>
  <path class="route-halo" d="M450 180 L445 440 L390 455 L530 455 L465 555"/><path class="route" d="M450 180 L445 440 L390 455 L530 455 L465 555"/>
  <g class="stop stop-link start" data-section="0" transform="translate(450 180)"><circle r="11"/><text y="4">1</text></g><g class="stop stop-link" data-section="1" transform="translate(445 440)"><circle r="11"/><text y="4">2</text></g><g class="stop stop-link" data-section="2" transform="translate(390 455)"><circle r="11"/><text y="4">3</text></g><g class="stop stop-link" data-section="3" transform="translate(530 455)"><circle r="11"/><text y="4">4</text></g><g class="stop stop-link end" data-section="3" transform="translate(465 555)"><circle r="11"/><text y="4">5</text></g>
  <text class="label stop-link" data-section="0" x="465" y="175">Alaverdi</text><text class="label stop-link" data-section="1" x="460" y="430">Yerevan</text><text class="label stop-link" data-section="2" x="375" y="480" text-anchor="end">Etchmiadzin</text><text class="label stop-link" data-section="3" x="545" y="450">Garni</text><text class="label stop-link" data-section="3" x="480" y="580">Khor Virap</text>
  <line class="divider" x1="878" y1="82" x2="878" y2="702"/><text class="small" x="900" y="108">ROUTE</text><text class="summary stop-link" data-section="0" x="900" y="150">1. Alaverdi</text><text class="summary stop-link" data-section="1" x="900" y="205">2. Yerevan</text><text class="summary stop-link" data-section="2" x="900" y="260">3. Etchmiadzin</text><text class="summary stop-link" data-section="3" x="900" y="315">4. Garni</text><text class="summary stop-link" data-section="3" x="900" y="370">5. Khor Virap</text><text class="note" x="42" y="735">Route positions are approximate</text>
</svg>
