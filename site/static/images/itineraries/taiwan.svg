<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Taiwan route map</title>
  <desc id="desc">Taiwan itinerary: Taipei, Hualien, Kaohsiung, Taichung, Sun Moon Lake.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.16" /></filter>
    <clipPath id="map-clip"><rect x="42" y="82" width="810" height="620" rx="18" /></clipPath>
  </defs>
  <style>
    .background{fill:#f5f1e9}.map-frame{fill:#dce8ea}.country{fill:#ded8ca;stroke:#8b8a82;stroke-width:1.4;vector-effect:non-scaling-stroke}.country-label{font:700 11px Arial,sans-serif;fill:#77736b;letter-spacing:1.2px;text-anchor:middle;paint-order:stroke;stroke:#ded8ca;stroke-width:3px}.route-halo{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.82}.route{fill:none;stroke:#d45545;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.stop circle{fill:#d45545;stroke:#fff;stroke-width:2.5;filter:url(#shadow);transition:stroke-width .15s ease}.stop.start circle{fill:#24735c}.stop.end circle{stroke:#71312d;stroke-width:3}.stop text{font:700 10px Arial,sans-serif;fill:#fff;text-anchor:middle}.place-label{font:600 14px Arial,sans-serif;fill:#292824;paint-order:stroke;stroke:#f5f1e9;stroke-width:4;stroke-linejoin:round}.title{font:700 34px Georgia,serif;fill:#292824}.route-title{font:700 13px Arial,sans-serif;fill:#77736b;letter-spacing:2px}.summary-number{font:700 13px Arial,sans-serif;fill:#d45545}.summary-text{font:600 14px Arial,sans-serif;fill:#292824}.attribution{font:11px Arial,sans-serif;fill:#77736b}.divider{stroke:#cbc5b9;stroke-width:1}.stop-link{cursor:pointer;outline:none}.summary-text,.place-label{transition:fill .15s ease}.summary-stop:hover .summary-text,.summary-stop:focus-visible .summary-text,.summary-stop.is-linked-hover .summary-text,.place-label:hover,.place-label:focus-visible,.place-label.is-linked-hover{fill:#a83d35;text-decoration:underline}.stop:hover circle,.stop:focus-visible circle,.stop.is-linked-hover circle{stroke:#292824;stroke-width:4}.lightbox-map .divider,.lightbox-map .route-title,.lightbox-map .summary-stop{display:none}
  </style>
  <rect class="background" width="1200" height="760" rx="24" />
  <text class="title" x="42" y="52">Taiwan</text>
  <rect class="map-frame" x="42" y="82" width="810" height="620" rx="18" />
  <g clip-path="url(#map-clip)">
    <path class="country" d="M554.7,264.4 L471.3,506.8 L411.9,630.9 L339.1,503.2 L323.1,391.1 L404.4,242.4 L515.7,128.0 L579.1,173.0 L554.7,264.4 Z"><title>Taiwan</title></path>
    
    <path class="route-halo" d="M524.6,166.7 L531.6,327.0 L351.3,532.6 L398.5,299.8 L435.9,345.1" />
    <path class="route" d="M524.6,166.7 L531.6,327.0 L351.3,532.6 L398.5,299.8 L435.9,345.1" />
    <g class="stop stop-link start" data-section="0" data-stop-name="Taipei" transform="translate(524.6 166.7)">
      <circle r="10" />
      <text x="0" y="4">1</text>
      <title>1. Taipei</title>
    </g>
<g class="stop stop-link" data-section="3" data-stop-name="Hualien" transform="translate(531.6 327.0)">
      <circle r="10" />
      <text x="0" y="4">2</text>
      <title>2. Hualien</title>
    </g>
<g class="stop stop-link" data-section="5" data-stop-name="Kaohsiung" transform="translate(351.3 532.6)">
      <circle r="10" />
      <text x="0" y="4">3</text>
      <title>3. Kaohsiung</title>
    </g>
<g class="stop stop-link" data-section="7" data-stop-name="Taichung" transform="translate(398.5 299.8)">
      <circle r="10" />
      <text x="0" y="4">4</text>
      <title>4. Taichung</title>
    </g>
<g class="stop stop-link end" data-section="8" data-stop-name="Sun Moon Lake" transform="translate(435.9 345.1)">
      <circle r="10" />
      <text x="0" y="4">5</text>
      <title>5. Sun Moon Lake</title>
    </g>
    <text class="place-label stop-link" data-section="0" data-stop-name="Taipei" x="536.6" y="156.7" text-anchor="start">Taipei</text>
<text class="place-label stop-link" data-section="3" data-stop-name="Hualien" x="543.6" y="345.0" text-anchor="start">Hualien</text>
<text class="place-label stop-link" data-section="5" data-stop-name="Kaohsiung" x="363.3" y="522.6" text-anchor="start">Kaohsiung</text>
<text class="place-label stop-link" data-section="7" data-stop-name="Taichung" x="410.5" y="317.8" text-anchor="start">Taichung</text>
<text class="place-label stop-link" data-section="8" data-stop-name="Sun Moon Lake" x="447.9" y="335.1" text-anchor="start">Sun Moon Lake</text>
  </g>
  <line class="divider" x1="878" y1="82" x2="878" y2="702" />
  <text class="route-title" x="900" y="108">ROUTE</text>
  <g class="summary-stop stop-link" data-section="0" data-stop-name="1. Taipei" transform="translate(900 145.0)">
      
      <text class="summary-text" x="0" y="0"><tspan x="0" dy="0">1. Taipei</tspan></text>
    </g>
<g class="summary-stop stop-link" data-section="3" data-stop-name="2. Hualien" transform="translate(900 203.0)">
      
      <text class="summary-text" x="0" y="0"><tspan x="0" dy="0">2. Hualien</tspan></text>
    </g>
<g class="summary-stop stop-link" data-section="5" data-stop-name="3. Kaohsiung" transform="translate(900 261.0)">
      
      <text class="summary-text" x="0" y="0"><tspan x="0" dy="0">3. Kaohsiung</tspan></text>
    </g>
<g class="summary-stop stop-link" data-section="7" data-stop-name="4. Taichung" transform="translate(900 319.0)">
      
      <text class="summary-text" x="0" y="0"><tspan x="0" dy="0">4. Taichung</tspan></text>
    </g>
<g class="summary-stop stop-link" data-section="8" data-stop-name="5. Sun Moon Lake" transform="translate(900 377.0)">
      
      <text class="summary-text" x="0" y="0"><tspan x="0" dy="0">5. Sun Moon Lake</tspan></text>
    </g>
  <text class="attribution" x="42" y="735">Country boundaries: Natural Earth via world-atlas · Route positions are approximate</text>
</svg>