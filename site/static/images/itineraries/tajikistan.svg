<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Tajikistan route map</title><desc id="desc">Tajikistan itinerary route; positions are approximate.</desc>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".16"/></filter></defs>
  <style>.bg{fill:#f5f1e9}.frame{fill:#dce8ea}.land{fill:#ded8ca;stroke:#8b8a82;stroke-width:2}.halo{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:#d45545;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.stop circle{fill:#d45545;stroke:#fff;stroke-width:3;filter:url(#shadow)}.start circle{fill:#24735c}.end circle{stroke:#71312d}.stop text{font:700 10px Arial;fill:#fff;text-anchor:middle}.label,.summary{font:600 14px Arial;fill:#292824}.label{paint-order:stroke;stroke:#f5f1e9;stroke-width:4}.heading{font:700 34px Georgia;fill:#292824}.small{font:700 13px Arial;fill:#77736b;letter-spacing:2px}.note{font:11px Arial;fill:#77736b}.divider{stroke:#cbc5b9}.stop-link{cursor:pointer}.stop-link:hover{opacity:.72}</style>
  <rect class="bg" width="1200" height="760" rx="24"/><text class="heading" x="42" y="52">Tajikistan</text><rect class="frame" x="42" y="82" width="810" height="620" rx="18"/><path class="land" d="M95 170 Q260 80 440 145 T800 155 L820 560 Q650 690 470 620 T90 590 Z"/>
  <path class="halo" d="M690 175 L720 310 L610 500 L485 410 L390 340 L270 435 L160 300 L180 360 L250 160"/><path class="route" d="M690 175 L720 310 L610 500 L485 410 L390 340 L270 435 L160 300 L180 360 L250 160"/>
  <g class="stop stop-link start" data-section="0" transform="translate(690 175)"><circle r="11"/><text y="4">1</text></g><text class="label stop-link" data-section="0" x="704" y="163">Karakul</text>
  <g class="stop stop-link" data-section="1" transform="translate(720 310)"><circle r="11"/><text y="4">2</text></g><text class="label stop-link" data-section="1" x="734" y="298">Murghab</text>
  <g class="stop stop-link" data-section="2" transform="translate(610 500)"><circle r="11"/><text y="4">3</text></g><text class="label stop-link" data-section="2" x="624" y="488">Wakhan</text>
  <g class="stop stop-link" data-section="3" transform="translate(485 410)"><circle r="11"/><text y="4">4</text></g><text class="label stop-link" data-section="3" x="499" y="398">Khorog</text>
  <g class="stop stop-link" data-section="4" transform="translate(390 340)"><circle r="11"/><text y="4">5</text></g><text class="label stop-link" data-section="4" x="404" y="328">Kalaikhum</text>
  <g class="stop stop-link" data-section="5" transform="translate(270 435)"><circle r="11"/><text y="4">6</text></g><text class="label stop-link" data-section="5" x="284" y="423">Dushanbe</text>
  <g class="stop stop-link" data-section="6" transform="translate(160 300)"><circle r="11"/><text y="4">7</text></g><text class="label stop-link" data-section="6" x="174" y="288">Panjakent</text>
  <g class="stop stop-link" data-section="7" transform="translate(180 360)"><circle r="11"/><text y="4">8</text></g><text class="label stop-link" data-section="7" x="194" y="348">Seven Lakes</text>
  <g class="stop stop-link end" data-section="9" transform="translate(250 160)"><circle r="11"/><text y="4">9</text></g><text class="label stop-link" data-section="9" x="264" y="148">Khujand</text>
  <line class="divider" x1="878" y1="82" x2="878" y2="702"/><text class="small" x="900" y="108">ROUTE</text>
  <text class="summary stop-link" data-section="0" x="900" y="145">1. Karakul</text>
  <text class="summary stop-link" data-section="1" x="900" y="197">2. Murghab</text>
  <text class="summary stop-link" data-section="2" x="900" y="249">3. Wakhan</text>
  <text class="summary stop-link" data-section="3" x="900" y="301">4. Khorog</text>
  <text class="summary stop-link" data-section="4" x="900" y="353">5. Kalaikhum</text>
  <text class="summary stop-link" data-section="5" x="900" y="405">6. Dushanbe</text>
  <text class="summary stop-link" data-section="6" x="900" y="457">7. Panjakent</text>
  <text class="summary stop-link" data-section="7" x="900" y="509">8. Seven Lakes</text>
  <text class="summary stop-link" data-section="9" x="900" y="561">9. Khujand</text>
  <text class="note" x="42" y="735">Route positions are approximate</text>
</svg>

