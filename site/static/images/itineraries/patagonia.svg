<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Winter Patagonia route map</title>
  <desc id="desc">One-way itinerary from Punta Arenas through Puerto Natales and Torres del Paine to El Calafate, El Chaltén and Perito Moreno Glacier. The return journey is omitted.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.16"/></filter>
    <clipPath id="map-clip"><rect x="42" y="82" width="810" height="620" rx="18"/></clipPath>
  </defs>
  <style>
    .background{fill:#f5f1e9}.map-frame{fill:#dce8ea}.land{fill:#ded8ca;stroke:#8b8a82;stroke-width:1.4;vector-effect:non-scaling-stroke}.border{fill:none;stroke:#aaa69d;stroke-width:1.5;stroke-dasharray:5 5}.country-name{font:700 17px Arial,sans-serif;fill:#77736b;letter-spacing:2px}.water-label{font:italic 15px Georgia,serif;fill:#78949a}.route-halo{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.82}.route{fill:none;stroke:#d45545;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.day-trip{fill:none;stroke:#d45545;stroke-width:4;stroke-dasharray:9 7;stroke-linecap:round}.stop circle{fill:#d45545;stroke:#fff;stroke-width:2.5;filter:url(#shadow)}.stop.start circle{fill:#24735c}.stop.end circle{stroke:#71312d;stroke-width:3}.stop text{font:700 10px Arial,sans-serif;fill:#fff;text-anchor:middle}.place-label{font:600 14px Arial,sans-serif;fill:#292824;paint-order:stroke;stroke:#f5f1e9;stroke-width:4;stroke-linejoin:round}.title{font:700 34px Georgia,serif;fill:#292824}.route-title{font:700 13px Arial,sans-serif;fill:#77736b;letter-spacing:2px}.summary-text{font:600 14px Arial,sans-serif;fill:#292824}.note{font:italic 12px Arial,sans-serif;fill:#77736b}.divider{stroke:#cbc5b9;stroke-width:1}.stop-link{cursor:pointer;outline:none}.summary-stop:hover .summary-text,.summary-stop:focus-visible .summary-text,.place-label:hover,.place-label:focus-visible{fill:#a83d35;text-decoration:underline}.stop:hover circle,.stop:focus-visible circle{stroke:#292824;stroke-width:4}.lightbox-map .divider,.lightbox-map .route-title,.lightbox-map .summary-stop{display:none}
  </style>
  <rect class="background" width="1200" height="760" rx="24"/>
  <text class="title" x="42" y="52">Patagonia in winter</text>
  <rect class="map-frame" x="42" y="82" width="810" height="620" rx="18"/>
  <g clip-path="url(#map-clip)">
    <path class="land" d="M260 55 L790 55 L814 144 L786 225 L805 315 L770 395 L783 470 L734 533 L746 603 L690 702 L530 702 L493 650 L462 610 L430 560 L402 510 L375 458 L343 400 L322 336 L301 275 L282 206 Z"/>
    <path class="border" d="M472 70 L482 150 L468 230 L490 305 L474 382 L500 455 L486 528 L520 605 L548 680"/>
    <path class="land" d="M260 488 L231 515 L245 538 L217 566 L239 589 L210 620 L247 646 L224 677 L275 706 L329 690 L312 650 L335 616 L307 583 L332 550 L296 520 Z"/>
    <text class="country-name" x="350" y="340" transform="rotate(-76 350 340)">CHILE</text>
    <text class="country-name" x="655" y="360" transform="rotate(-76 655 360)">ARGENTINA</text>
    <text class="water-label" x="84" y="390" transform="rotate(-78 84 390)">Pacific Ocean</text>
    <text class="water-label" x="804" y="390" transform="rotate(78 804 390)">Atlantic Ocean</text>

    <path class="route-halo" d="M390 612 L430 496 L456 405 L470 390 L586 350 L604 176"/>
    <path class="route" d="M390 612 L430 496 L456 405 L470 390 L586 350 L604 176"/>
    <path class="day-trip" d="M586 350 L676 286 L586 350"/>
    <path class="day-trip" d="M586 350 L512 395 L586 350"/>

    <g class="stop stop-link start" data-section="0" data-stop-name="Punta Arenas" transform="translate(390 612)"><circle r="10"/><text y="4">1</text><title>1. Punta Arenas</title></g>
    <g class="stop stop-link" data-section="1" data-stop-name="Puerto Natales" transform="translate(430 496)"><circle r="10"/><text y="4">2</text><title>2. Puerto Natales</title></g>
    <g class="stop stop-link" data-section="2" data-stop-name="Torres del Paine" transform="translate(456 405)"><circle r="10"/><text y="4">3</text><title>3. Torres del Paine</title></g>
    <g class="stop stop-link" data-section="3" data-stop-name="Base Torres" transform="translate(470 390)"><circle r="10"/><text y="4">4</text><title>4. Base Torres</title></g>
    <g class="stop stop-link" data-section="4" data-stop-name="El Calafate" transform="translate(586 350)"><circle r="10"/><text y="4">5</text><title>5. El Calafate</title></g>
    <g class="stop stop-link" data-section="5" data-stop-name="El Chaltén" transform="translate(604 176)"><circle r="10"/><text y="4">6</text><title>6. El Chaltén</title></g>
    <g class="stop stop-link end" data-section="6" data-stop-name="Perito Moreno" transform="translate(512 395)"><circle r="10"/><text y="4">7</text><title>7. Perito Moreno Glacier</title></g>

    <text class="place-label stop-link" data-section="0" data-stop-name="Punta Arenas" x="376" y="638" text-anchor="end">Punta Arenas</text>
    <text class="place-label stop-link" data-section="1" data-stop-name="Puerto Natales" x="416" y="520" text-anchor="end">Puerto Natales</text>
    <text class="place-label stop-link" data-section="2" data-stop-name="Torres del Paine" x="442" y="389" text-anchor="end">Torres del Paine</text>
    <text class="place-label stop-link" data-section="3" data-stop-name="Base Torres" x="482" y="383">Base Torres</text>
    <text class="place-label stop-link" data-section="4" data-stop-name="El Calafate" x="600" y="374">El Calafate</text>
    <text class="place-label stop-link" data-section="5" data-stop-name="El Chaltén" x="618" y="169">El Chaltén</text>
    <text class="place-label stop-link" data-section="6" data-stop-name="Perito Moreno" x="498" y="421" text-anchor="end">Perito Moreno</text>
  </g>

  <line class="divider" x1="878" y1="82" x2="878" y2="702"/>
  <text class="route-title" x="900" y="108">ONE-WAY ROUTE</text>
  <g class="summary-stop stop-link" data-section="0" data-stop-name="1. Punta Arenas" transform="translate(900 158)"><text class="summary-text">1. Punta Arenas</text></g>
  <g class="summary-stop stop-link" data-section="1" data-stop-name="2. Puerto Natales" transform="translate(900 220)"><text class="summary-text">2. Puerto Natales</text></g>
  <g class="summary-stop stop-link" data-section="2" data-stop-name="3. Torres del Paine" transform="translate(900 282)"><text class="summary-text">3. Torres del Paine</text></g>
  <g class="summary-stop stop-link" data-section="3" data-stop-name="4. Base Torres" transform="translate(900 344)"><text class="summary-text">4. Base Torres</text></g>
  <g class="summary-stop stop-link" data-section="4" data-stop-name="5. El Calafate" transform="translate(900 406)"><text class="summary-text">5. El Calafate</text></g>
  <g class="summary-stop stop-link" data-section="5" data-stop-name="6. El Chaltén" transform="translate(900 468)"><text class="summary-text">6. El Chaltén</text></g>
  <g class="summary-stop stop-link" data-section="6" data-stop-name="7. Perito Moreno" transform="translate(900 530)"><text class="summary-text">7. Perito Moreno</text></g>
  <text class="note" x="900" y="590"><tspan x="900">Day 8 return omitted</tspan><tspan x="900" dy="19">for readability.</tspan></text>
  <text class="note" x="42" y="735">Route positions are approximate · Dashed lines indicate day trips</text>
</svg>
