    <text class="country-label" x="449.0" y="405.0">Iceland</text>
    <path class="route-halo" d="M264.3,532.2 L443.9,643.0 L619.2,542.6 L264.3,532.2 L442.6,557.3 L264.3,532.2 L314.6,516.0 L366.2,508.6 L377.4,505.7 L329.5,548.5 L264.3,532.2 L243.8,570.6" />
    <path class="route" d="M264.3,532.2 L443.9,643.0 L619.2,542.6 L264.3,532.2 L442.6,557.3 L264.3,532.2 L314.6,516.0 L366.2,508.6 L377.4,505.7 L329.5,548.5 L264.3,532.2 L243.8,570.6" />
