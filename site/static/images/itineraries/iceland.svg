      <text x="0" y="4">5</text>
      <title>5. Thingvellir</title>
    </g>
<g class="stop stop-link" data-section="4" data-stop-name="Geysir" transform="translate(366.2 508.6)">
      <circle r="10" />
      <text x="0" y="4">6</text>
      <title>6. Geysir</title>
    </g>
<g class="stop stop-link" data-section="4" data-stop-name="Gullfoss" transform="translate(377.4 505.7)">
      <circle r="10" />
      <text x="0" y="4">7</text>
      <title>7. Gullfoss</title>
    </g>
<g class="stop stop-link" data-section="4" data-stop-name="Kerið" transform="translate(329.5 548.5)">
      <circle r="10" />
      <text x="0" y="4">8</text>
      <title>8. Kerið</title>
    </g>
<g class="stop stop-link end" data-section="5" data-stop-name="Fagradalsfjall" transform="translate(243.8 570.6)">
      <circle r="10" />
      <text x="0" y="4">9</text>
      <title>9. Fagradalsfjall</title>
    </g>
    <text class="place-label stop-link" data-section="0" data-stop-name="Reykjavik" x="276.3" y="518.2" text-anchor="start">Reykjavik</text>
<text class="place-label stop-link" data-section="2" data-stop-name="Reynisfjara" x="455.9" y="661.0" text-anchor="start">Reynisfjara</text>

<text class="place-label stop-link" data-section="3" data-stop-name="Landmannalaugar" x="454.6" y="575.3" text-anchor="start">Landmannalaugar</text>
<text class="place-label stop-link" data-section="4" data-stop-name="Thingvellir" x="326.6" y="506.0" text-anchor="start">Thingvellir</text>

<text class="place-label stop-link" data-section="4" data-stop-name="Gullfoss" x="389.4" y="481.7" text-anchor="start">Gullfoss</text>

<text class="place-label stop-link" data-section="5" data-stop-name="Fagradalsfjall" x="255.8" y="594.6" text-anchor="start">Fagradalsfjall</text>
  </g>
  <line class="divider" x1="878" y1="82" x2="878" y2="702" />
