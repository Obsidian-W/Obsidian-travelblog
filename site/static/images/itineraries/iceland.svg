<g class="summary-stop stop-link" data-section="4" data-stop-name="7. Gullfoss" transform="translate(900 493.0)">
      <text class="summary-text" x="0" y="0"><tspan x="0" dy="0">7. Gullfoss</tspan></text>
    </g>
<g class="summary-stop stop-link" data-section="4" data-stop-name="8. Kerið" transform="translate(900 551.0)">
