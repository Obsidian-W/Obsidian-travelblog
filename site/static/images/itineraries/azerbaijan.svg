<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Azerbaijan route map</title><desc id="desc">Azerbaijan itinerary through Baku, Qobustan, Xinaliq, Sheki and Kish.</desc>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".16"/></filter></defs>
  <style>.bg{fill:#f5f1e9}.sea{fill:#dce8ea}.land{fill:#ded8ca;stroke:#8b8a82;stroke-width:2}.route-halo{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:#d45545;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.stop circle{fill:#d45545;stroke:#fff;stroke-width:3;filter:url(#shadow)}.stop.start circle{fill:#24735c}.stop.end circle{stroke:#71312d}.stop text{font:700 10px Arial;fill:#fff;text-anchor:middle}.label,.summary{font:600 14px Arial;fill:#292824}.label{paint-order:stroke;stroke:#f5f1e9;stroke-width:4}.title{font:700 34px Georgia;fill:#292824}.small{font:700 13px Arial;fill:#77736b;letter-spacing:2px}.note{font:11px Arial;fill:#77736b}.divider{stroke:#cbc5b9}.stop-link{cursor:pointer}.stop-link:hover{opacity:.72}</style>
  <rect class="bg" width="1200" height="760" rx="24"/><text class="title" x="42" y="52">Azerbaijan</text><rect class="sea" x="42" y="82" width="810" height="620" rx="18"/>
  <path class="land" d="M105 235 L220 155 L390 175 L510 120 L665 180 L790 135 L820 240 L730 300 L810 380 L720 440 L765 545 L630 630 L505 570 L430 450 L285 410 L205 320 Z"/>
  <path class="route-halo" d="M735 420 L675 462 L430 235 L300 305 L325 285"/><path class="route" d="M735 420 L675 462 L430 235 L300 305 L325 285"/>
  <g class="stop stop-link start" data-section="0" data-stop-name="Baku" transform="translate(735 420)"><circle r="11"/><text y="4">1</text></g><g class="stop stop-link" data-section="2" data-stop-name="Qobustan" transform="translate(675 462)"><circle r="11"/><text y="4">2</text></g><g class="stop stop-link" data-section="3" data-stop-name="Xinaliq" transform="translate(430 235)"><circle r="11"/><text y="4">3</text></g><g class="stop stop-link" data-section="4" data-stop-name="Sheki" transform="translate(300 305)"><circle r="11"/><text y="4">4</text></g><g class="stop stop-link end" data-section="5" data-stop-name="Kish" transform="translate(325 285)"><circle r="11"/><text y="4">5</text></g>
  <text class="label stop-link" data-section="0" x="750" y="414">Baku</text><text class="label stop-link" data-section="2" x="660" y="488" text-anchor="end">Qobustan</text><text class="label stop-link" data-section="3" x="445" y="225">Xinaliq</text><text class="label stop-link" data-section="4" x="284" y="330" text-anchor="end">Sheki</text><text class="label stop-link" data-section="5" x="338" y="279">Kish</text>
  <line class="divider" x1="878" y1="82" x2="878" y2="702"/><text class="small" x="900" y="108">ROUTE</text><text class="summary stop-link" data-section="0" x="900" y="150">1. Baku</text><text class="summary stop-link" data-section="2" x="900" y="205">2. Qobustan</text><text class="summary stop-link" data-section="3" x="900" y="260">3. Xinaliq</text><text class="summary stop-link" data-section="4" x="900" y="315">4. Sheki</text><text class="summary stop-link" data-section="5" x="900" y="370">5. Kish</text><text class="note" x="42" y="735">Route positions are approximate</text>
</svg>
