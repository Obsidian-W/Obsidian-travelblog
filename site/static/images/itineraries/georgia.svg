<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Georgia route map</title><desc id="desc">Georgia itinerary through Sighnaghi, Tbilisi, Gori, Kazbegi and Mtskheta.</desc>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".16"/></filter></defs><style>.bg{fill:#f5f1e9}.sea{fill:#dce8ea}.land{fill:#ded8ca;stroke:#8b8a82;stroke-width:2}.route-halo{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:#d45545;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.stop circle{fill:#d45545;stroke:#fff;stroke-width:3;filter:url(#shadow)}.stop.start circle{fill:#24735c}.stop.end circle{stroke:#71312d}.stop text{font:700 10px Arial;fill:#fff;text-anchor:middle}.label,.summary{font:600 14px Arial;fill:#292824}.label{paint-order:stroke;stroke:#f5f1e9;stroke-width:4}.title{font:700 34px Georgia;fill:#292824}.small{font:700 13px Arial;fill:#77736b;letter-spacing:2px}.note{font:11px Arial;fill:#77736b}.divider{stroke:#cbc5b9}.stop-link{cursor:pointer}.stop-link:hover{opacity:.72}</style>
  <rect class="bg" width="1200" height="760" rx="24"/><text class="title" x="42" y="52">Georgia</text><rect class="sea" x="42" y="82" width="810" height="620" rx="18"/><path class="land" d="M105 315 L180 210 L330 170 L465 225 L575 160 L720 205 L810 300 L765 415 L655 470 L535 430 L410 485 L265 445 L165 390 Z"/>
  <path class="route-halo" d="M700 370 L570 350 L420 365 L545 195 L535 335 L570 350"/><path class="route" d="M700 370 L570 350 L420 365 L545 195 L535 335 L570 350"/>
  <g class="stop stop-link start" data-section="0" transform="translate(700 370)"><circle r="11"/><text y="4">1</text></g><g class="stop stop-link" data-section="1" transform="translate(570 350)"><circle r="11"/><text y="4">2</text></g><g class="stop stop-link" data-section="3" transform="translate(420 365)"><circle r="11"/><text y="4">3</text></g><g class="stop stop-link" data-section="4" transform="translate(545 195)"><circle r="11"/><text y="4">4</text></g><g class="stop stop-link end" data-section="5" transform="translate(535 335)"><circle r="11"/><text y="4">5</text></g>
  <text class="label stop-link" data-section="0" x="715" y="365">Sighnaghi</text><text class="label stop-link" data-section="1" x="585" y="378">Tbilisi</text><text class="label stop-link" data-section="3" x="405" y="392" text-anchor="end">Gori</text><text class="label stop-link" data-section="4" x="560" y="190">Kazbegi</text><text class="label stop-link" data-section="5" x="520" y="325" text-anchor="end">Mtskheta</text>
  <line class="divider" x1="878" y1="82" x2="878" y2="702"/><text class="small" x="900" y="108">ROUTE</text><text class="summary stop-link" data-section="0" x="900" y="150">1. Sighnaghi</text><text class="summary stop-link" data-section="1" x="900" y="205">2. Tbilisi</text><text class="summary stop-link" data-section="3" x="900" y="260">3. Gori</text><text class="summary stop-link" data-section="4" x="900" y="315">4. Kazbegi</text><text class="summary stop-link" data-section="5" x="900" y="370">5. Mtskheta</text><text class="note" x="42" y="735">Route positions are approximate</text>
</svg>
