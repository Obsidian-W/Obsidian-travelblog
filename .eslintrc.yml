env:
  browser: true
  es2020: true

parserOptions:
  ecmaVersion: 2020

plugins:
  - cypress

extends:
  - eslint:recommended
  - plugin:cypress/recommended

rules:
  comma-spacing: 2
  eol-last: 2
  eqeqeq: ["error", "smart"]
  indent: [2, 2, { SwitchCase: 1 }]
  keyword-spacing: 2
  max-len: [1, 160, 2]
  no-console: 1
  no-debugger: 2
  no-trailing-spaces: 2
  object-curly-spacing: [2, "never"]
  quotes: [2, "double", "avoid-escape"]
  semi: 2
  space-before-blocks: 2
  space-before-function-paren: [2, "never"]
  space-infix-ops: 2
